services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    networks: [appnet]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  api:
    build: .
    networks: [appnet]
    volumes:
      - appdata:/data
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      QUEUE_NAME: tasks
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build: .
    command: ["python", "-m", "app.consumer"]
    networks: [appnet]
    volumes:
      - appdata:/data
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      QUEUE_NAME: tasks
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      WORK_DELAY: "3"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    networks: [appnet]
    depends_on:
      api:
        condition: service_healthy

volumes:
  appdata:

networks:
  appnet: